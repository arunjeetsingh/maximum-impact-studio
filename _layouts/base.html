<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.studio.name }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">◢◣</span>
      <span class="brand-name">{{ site.studio.name }}</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}#apps">Apps</a>
      <a href="{{ site.studio.github }}" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© {{ site.studio.copyright_year }} {{ site.studio.name }}.</p>
    <p class="footer-links">
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a> ·
      <a href="mailto:{{ site.studio.email }}">{{ site.studio.email }}</a> ·
      <a href="{{ site.studio.github }}" rel="noopener">GitHub</a>
    </p>
  </footer>
</body>
</html>
