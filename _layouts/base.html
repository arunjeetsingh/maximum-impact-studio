<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.studio.name }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/jpeg" href="{{ '/assets/img/logo.jpg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/logo.jpg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if jekyll.environment == "production" and site.google_analytics %}
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="{{ site.studio.name }} logo">
      <span class="brand-name">{{ site.studio.name }}</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Blog</a>
      <a href="{{ '/apps/' | relative_url }}">Apps</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ site.studio.github }}" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main class="site-main{% if page.body_class %} {{ page.body_class }}{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© {{ site.studio.copyright_year }} {{ site.studio.name }}.</p>
    <p class="footer-links">
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a> ·
      <a href="mailto:{{ site.studio.email }}">{{ site.studio.email }}</a> ·
      <a href="{{ site.studio.github }}" rel="noopener">GitHub</a>
    </p>
  </footer>
</body>
</html>
