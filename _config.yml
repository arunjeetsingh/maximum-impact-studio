title: Maximum Impact Studio
description: Apps and games that spark joy.
url: https://maximumimpact.studio
baseurl: ""

# Custom layouts/includes; no external theme so we control everything.
plugins:
  - jekyll-seo-tag

# Google Analytics 4. Only fires when JEKYLL_ENV=production (i.e. on the
# GitHub Pages build), so local `jekyll serve` does not pollute stats.
# Fill in the GA4 Measurement ID below once Arun provides it.
google_analytics: "G-JLZHTEFMQ3"

# Blog post permalinks: /YYYY/MM/slug/
permalink: /:year/:month/:title/

# Build posts whose date is in the future (we date announcements ahead of time).
future: true

# Default author byline for posts.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Arun Singh
      author_url: https://www.linkedin.com/in/arunjeetsingh/

# Files that are repo bookkeeping, not site pages.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Studio-wide identity reused across pages.
studio:
  name: Maximum Impact Studio
  email: hello@maximumimpact.studio
  github: https://github.com/arunjeetsingh
  linkedin: https://www.linkedin.com/in/arunjeetsingh/
  twitter: https://x.com/aruntalkstech
  twitter_handle: "@aruntalkstech"
  copyright_year: 2026
